      <div id="text"></div>
      <img id="icon" width="40px" height="40px"/>
      <script>
         var params = new URLSearchParams(window.location.search);
         var playerId = params.get('playerId');
         var textColor = params.get('textColor');
         var text = params.get('text');
         var icon = params.get('icon');

         var html = '';

         if (text) {
            // get color by first checking amenity of the playerId
            // if it's friendly, use the player color; otherwise, use the amenity color
            var textDiv = document.getElementById('text');
            textDiv.innerHTML = text;
            textDiv.style.color = 'rgb(' + textColor + ')';
         }
         if (icon) {
            var iconImg = document.getElementById('icon');
            iconImg.src = icon;
         }

         // var container = document.getElementById('container');

      </script>
